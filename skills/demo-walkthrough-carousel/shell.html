<title>{{TITLE}}</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&amp;family=Roboto:wght@400;500;700&amp;display=swap">
<style>
/* Layout: one Creatio screen at a time on a neutral stage, caption above, numbered strip of all screens below */
:root{
  --bg:#EEF1F5; --panel:#FFFFFF; --fg:#13233A; --muted:#55627A; --line:#D5DBE4;
  --accent:#1665F0; --accent-ink:#FFFFFF; --stage:#DCE2EA; --hot:#F57C1F;
  --display:"Montserrat", "Segoe UI", Arial, sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#0F1724;--panel:#172235;--fg:#E7ECF4;--muted:#9DAAC0;--line:#2A3850;--accent:#5B95FF;--accent-ink:#0B1220;--stage:#0A111C;--hot:#FF9B4A;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0F1724;--panel:#172235;--fg:#E7ECF4;--muted:#9DAAC0;--line:#2A3850;--accent:#5B95FF;--accent-ink:#0B1220;--stage:#0A111C;--hot:#FF9B4A;color-scheme:dark}
body{background:var(--bg);color:var(--fg);font-family:var(--display)}
.wrap{max-width:1560px;margin:0 auto;padding-block:16px 28px;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));display:flex;flex-direction:column;gap:14px}
.top{display:flex;flex-wrap:wrap;align-items:center;gap:12px}
.brand{display:flex;flex-direction:column;gap:2px;min-width:0}
.brand b{font-size:18px;font-weight:700;letter-spacing:.01em;text-wrap:balance}
.brand span{font-size:12px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.ctrls{margin-left:auto;display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.btn{font:600 14px var(--display);padding:9px 14px;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:var(--fg);cursor:pointer;min-height:40px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn:focus-visible,.thumb:focus-visible{outline:3px solid var(--hot);outline-offset:2px}
.count{font:600 14px var(--display);color:var(--muted);font-variant-numeric:tabular-nums;min-width:56px;text-align:center}
.toggle{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);padding:0 4px;cursor:pointer}
.toggle input{width:16px;height:16px;accent-color:var(--accent)}
.cap{display:flex;flex-wrap:wrap;align-items:baseline;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 16px}
.cap .uc{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--accent-ink);background:var(--accent);border-radius:6px;padding:3px 8px}
.cap h1{margin:0;font-size:18px;font-weight:600;text-wrap:balance;min-width:0;flex:1 1 420px}
.cap p{margin:0;font-size:14px;color:var(--muted);flex:1 1 100%;max-width:110ch;line-height:1.5}
.cap .hint{font-size:12px;color:var(--muted)}
.stage{background:var(--stage);border-radius:14px;overflow:hidden;position:relative}
.slide .fit{transform-origin:top left}
.slide[data-kind="phone"] .fit{transform-origin:top center;padding:24px 0}
.screen.desk{width:1440px}
.screen.phone{width:390px;height:844px;margin:0 auto;border-radius:44px;border:12px solid #10151E;box-shadow:0 20px 50px rgba(0,0,0,.25);overflow:hidden;box-sizing:content-box}
body.hot .screen a[data-go]{outline:2px solid var(--hot);outline-offset:2px;border-radius:4px;cursor:pointer}
body.hidetags .screen .tag{display:none!important}
.screen button{cursor:default}
.thumbs{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px}
.thumb{flex:0 0 auto;display:flex;flex-direction:column;align-items:flex-start;gap:2px;padding:9px 12px;border-radius:10px;border:1px solid var(--line);background:var(--panel);color:var(--fg);font-family:var(--display);cursor:pointer;min-width:132px;text-align:left}
.thumb .tn{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.thumb .tu{font-size:11px;font-weight:700;letter-spacing:.05em;color:var(--accent)}
.thumb .tt{font-size:13px;font-weight:600}
.thumb[aria-current="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
@media (prefers-reduced-motion: no-preference){.slide:not([hidden]) .fit{animation:in .25s ease-out}@keyframes in{from{opacity:.4}to{opacity:1}}}
</style>
<style>
/*SCREENCSS*/
</style>
<div class="wrap">
  <div class="top">
    <div class="brand"><span>{{BRAND_LINE}}</span><b>{{HEADLINE}}</b></div>
    <div class="ctrls">
      <label class="toggle" for="t-hot"><input type="checkbox" id="t-hot" checked> Show clickable</label>
      <label class="toggle" for="t-tags"><input type="checkbox" id="t-tags" checked> Build labels</label>
      <button type="button" class="btn" id="prev" aria-label="Previous screen">← Prev</button>
      <span class="count" id="count">1 / {{COUNT}}</span>
      <button type="button" class="btn primary" id="next" aria-label="Next screen">Next →</button>
    </div>
  </div>
  <div class="cap"><span class="uc" id="cap-uc">Start</span><h1 id="cap-title"></h1><span class="hint">Click the outlined elements inside the screen, or use ← →</span><p id="cap-desc"></p></div>
  <div class="stage" id="stage">
<!--SLIDES-->
  </div>
  <nav class="thumbs" aria-label="All screens">
<!--THUMBS-->
  </nav>
</div>
<script>
(function(){
  var slides=[].slice.call(document.querySelectorAll('.slide'));
  var ids=slides.map(function(s){return s.dataset.id});
  var thumbs=[].slice.call(document.querySelectorAll('.thumb'));
  var stage=document.getElementById('stage'), cur=0;
  function fit(){
    var s=slides[cur], f=s.querySelector('.fit'), sc=s.querySelector('.screen'), w=stage.clientWidth;
    if(s.dataset.kind==='desk'){var k=Math.min(1,w/1440);f.style.transform='scale('+k+')';stage.style.height=Math.ceil(sc.offsetHeight*k)+'px';}
    else{var k2=Math.min(1,(w-16)/414,(window.innerHeight-260)/892);k2=Math.max(k2,.45);f.style.transform='scale('+k2+')';stage.style.height=Math.ceil((892+48)*k2)+'px';}
  }
  function show(i,noHash){
    cur=(i+slides.length)%slides.length;
    slides.forEach(function(s,j){s.hidden=j!==cur});
    var s=slides[cur];
    document.getElementById('cap-uc').textContent=s.dataset.uc;
    document.getElementById('cap-title').textContent=s.dataset.title;
    document.getElementById('cap-desc').textContent=s.dataset.desc;
    document.getElementById('count').textContent=(cur+1)+' / '+slides.length;
    thumbs.forEach(function(t,j){t.setAttribute('aria-current',j===cur?'true':'false')});
    var th=thumbs[cur]; if(th&&th.scrollIntoView){th.scrollIntoView({block:'nearest',inline:'nearest'})}
    if(!noHash){try{history.replaceState(null,'','#'+s.dataset.id)}catch(e){}}
    fit();
  }
  document.addEventListener('click',function(e){
    var a=e.target.closest('[data-go]'); if(!a)return;
    var j=ids.indexOf(a.dataset.go); if(j<0)return;
    e.preventDefault(); show(j);
  });
  document.getElementById('prev').onclick=function(){show(cur-1)};
  document.getElementById('next').onclick=function(){show(cur+1)};
  document.addEventListener('keydown',function(e){
    if(e.target.closest&&e.target.closest('input,textarea'))return;
    if(e.key==='ArrowRight'){show(cur+1)} else if(e.key==='ArrowLeft'){show(cur-1)}
  });
  var hot=document.getElementById('t-hot'), tags=document.getElementById('t-tags');
  function flags(){document.body.classList.toggle('hot',hot.checked);document.body.classList.toggle('hidetags',!tags.checked);fit()}
  hot.onchange=flags; tags.onchange=flags;
  window.addEventListener('resize',fit);
  if(document.fonts&&document.fonts.ready){document.fonts.ready.then(fit)}
  var h=(location.hash||'').slice(1), start=Math.max(0,ids.indexOf(h));
  flags(); show(start,true);
})();
</script>

<title>{{TITLE}}</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&amp;family=Roboto:wght@400;500;700&amp;display=swap">
<style>
/* Layout: one Creatio screen at a time on a neutral stage, caption above, numbered strip of all screens below */
:root{
  --bg:#EEF1F5; --panel:#FFFFFF; --fg:#13233A; --muted:#55627A; --line:#D5DBE4;
  --accent:#1665F0; --accent-ink:#FFFFFF; --stage:#DCE2EA; --hot:#F57C1F;
  --display:"Montserrat", "Segoe UI", Arial, sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#0F1724;--panel:#172235;--fg:#E7ECF4;--muted:#9DAAC0;--line:#2A3850;--accent:#5B95FF;--accent-ink:#0B1220;--stage:#0A111C;--hot:#FF9B4A;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0F1724;--panel:#172235;--fg:#E7ECF4;--muted:#9DAAC0;--line:#2A3850;--accent:#5B95FF;--accent-ink:#0B1220;--stage:#0A111C;--hot:#FF9B4A;color-scheme:dark}
body{background:var(--bg);color:var(--fg);font-family:var(--display)}
.wrap{max-width:1560px;margin:0 auto;padding-block:16px 28px;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));display:flex;flex-direction:column;gap:14px}
.top{display:flex;flex-wrap:wrap;align-items:center;gap:12px}
.brand{display:flex;flex-direction:column;gap:2px;min-width:0}
.brand b{font-size:18px;font-weight:700;letter-spacing:.01em;text-wrap:balance}
.brand span{font-size:12px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.ctrls{margin-left:auto;display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.btn{font:600 14px var(--display);padding:9px 14px;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:var(--fg);cursor:pointer;min-height:40px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn:focus-visible,.thumb:focus-visible{outline:3px solid var(--hot);outline-offset:2px}
.count{font:600 14px var(--display);color:var(--muted);font-variant-numeric:tabular-nums;min-width:56px;text-align:center}
.toggle{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);padding:0 4px;cursor:pointer}
.toggle input{width:16px;height:16px;accent-color:var(--accent)}
.cap{display:flex;flex-wrap:wrap;align-items:baseline;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 16px}
.cap .uc{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--accent-ink);background:var(--accent);border-radius:6px;padding:3px 8px}
.cap h1{margin:0;font-size:18px;font-weight:600;text-wrap:balance;min-width:0;flex:1 1 420px}
.cap p{margin:0;font-size:14px;color:var(--muted);flex:1 1 100%;max-width:110ch;line-height:1.5}
.cap .hint{font-size:12px;color:var(--muted)}
.stage{background:var(--stage);border-radius:14px;overflow:hidden;position:relative}
.slide .fit{transform-origin:top left}
.slide[data-kind="phone"] .fit{transform-origin:top center;padding:24px 0}
.screen.desk{width:1440px}
.screen.phone{width:390px;height:844px;margin:0 auto;border-radius:44px;border:12px solid #10151E;box-shadow:0 20px 50px rgba(0,0,0,.25);overflow:hidden;box-sizing:content-box}
body.hot .screen a[data-go]{outline:2px solid var(--hot);outline-offset:2px;border-radius:4px;cursor:pointer}
body.hidetags .screen .tag{display:none!important}
.screen button{cursor:default}
.thumbs{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px}
.notes{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:10px}
.note{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 16px;font-size:14px;line-height:1.5;min-width:0}
.note h2{margin:0 0 6px;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.note ol,.note ul{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:4px}
.note p{margin:0;white-space:pre-line}
.note.q{border-left:4px solid var(--hot)}
.note.q h2{color:var(--hot)}
.qbtn{font:600 13px var(--display);padding:7px 12px;border-radius:20px;border:1px solid var(--hot);background:var(--panel);color:var(--hot);cursor:pointer;min-height:36px}
.thumb .tq{font-size:11px;font-weight:700;color:var(--hot)}
body.nonotes .note.n{display:none}
body.noq .note.q,body.noq .thumb .tq,body.noq #qbtn{display:none}
@media print{.ctrls,.thumbs,.hint{display:none!important}}
.thumb{flex:0 0 auto;display:flex;flex-direction:column;align-items:flex-start;gap:2px;padding:9px 12px;border-radius:10px;border:1px solid var(--line);background:var(--panel);color:var(--fg);font-family:var(--display);cursor:pointer;min-width:132px;text-align:left}
.thumb .tn{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.thumb .tu{font-size:11px;font-weight:700;letter-spacing:.05em;color:var(--accent)}
.thumb .tt{font-size:13px;font-weight:600}
.thumb[aria-current="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
@media (prefers-reduced-motion: no-preference){.slide:not([hidden]) .fit{animation:in .25s ease-out}@keyframes in{from{opacity:.4}to{opacity:1}}}
</style>
<style>
/*SCREENCSS*/
</style>
<div class="wrap">
  <div class="top">
    <div class="brand"><span>{{BRAND_LINE}}</span><b>{{HEADLINE}}</b></div>
    <div class="ctrls">
      <label class="toggle" for="t-hot"><input type="checkbox" id="t-hot" checked> Show clickable</label>
      <label class="toggle" for="t-tags"><input type="checkbox" id="t-tags" checked> Build labels</label>
      <label class="toggle" for="t-notes"><input type="checkbox" id="t-notes" checked> Presenter notes</label>
      <label class="toggle" for="t-q"><input type="checkbox" id="t-q" checked> Open questions</label>
      <button type="button" class="qbtn" id="qbtn" hidden></button>
      <button type="button" class="btn" id="prev" aria-label="Previous screen">← Prev</button>
      <span class="count" id="count">1 / {{COUNT}}</span>
      <button type="button" class="btn primary" id="next" aria-label="Next screen">Next →</button>
    </div>
  </div>
  <div class="cap"><span class="uc" id="cap-uc">Start</span><h1 id="cap-title"></h1><span class="hint">Click the outlined elements inside the screen, or use ← →</span><p id="cap-desc"></p></div>
  <div class="notes" id="notes">
    <section class="note n" id="n-click" hidden><h2>Click</h2><ol id="n-click-list"></ol></section>
    <section class="note n" id="n-say" hidden><h2>Say</h2><p id="n-say-text"></p></section>
    <section class="note q" id="n-q" hidden><h2>Open questions for the SE</h2><ul id="n-q-list"></ul></section>
  </div>
  <div class="stage" id="stage">
<!--SLIDES-->
  </div>
  <nav class="thumbs" aria-label="All screens">
<!--THUMBS-->
  </nav>
</div>
<script type="application/json" id="notes-data">/*NOTESJSON*/</script>
<script>
(function(){
  var slides=[].slice.call(document.querySelectorAll('.slide'));
  var ids=slides.map(function(s){return s.dataset.id});
  var thumbs=[].slice.call(document.querySelectorAll('.thumb'));
  var stage=document.getElementById('stage'), cur=0;
  var NOTES={}; try{NOTES=JSON.parse(document.getElementById('notes-data').textContent)||{}}catch(e){}
  function fill(listId,items){var ul=document.getElementById(listId);ul.textContent='';(items||[]).forEach(function(t){var li=document.createElement('li');li.textContent=t;ul.appendChild(li)})}
  function notes(id){
    var n=NOTES[id]||{};
    fill('n-click-list',n.click); document.getElementById('n-click').hidden=!(n.click&&n.click.length);
    document.getElementById('n-say-text').textContent=n.say||''; document.getElementById('n-say').hidden=!n.say;
    fill('n-q-list',n.questions); document.getElementById('n-q').hidden=!(n.questions&&n.questions.length);
  }
  var qIdx=ids.filter(function(id){var n=NOTES[id];return n&&n.questions&&n.questions.length});
  var qTotal=qIdx.reduce(function(a,id){return a+NOTES[id].questions.length},0);
  var qbtn=document.getElementById('qbtn');
  if(qTotal){qbtn.hidden=false;qbtn.textContent=qTotal+' open question'+(qTotal>1?'s':'')+' \u2192';qbtn.title='Jump to the next screen with open questions';
    qbtn.onclick=function(){for(var k=1;k<=slides.length;k++){var j=(cur+k)%slides.length;if(qIdx.indexOf(ids[j])>=0){show(j);return}}}}
  function fit(){
    var s=slides[cur], f=s.querySelector('.fit'), sc=s.querySelector('.screen'), w=stage.clientWidth;
    if(s.dataset.kind==='desk'){var k=Math.min(1,w/1440);f.style.transform='scale('+k+')';stage.style.height=Math.ceil(sc.offsetHeight*k)+'px';}
    else{var k2=Math.min(1,(w-16)/414,(window.innerHeight-260)/892);k2=Math.max(k2,.45);f.style.transform='scale('+k2+')';stage.style.height=Math.ceil((892+48)*k2)+'px';}
  }
  function show(i,noHash){
    cur=(i+slides.length)%slides.length;
    slides.forEach(function(s,j){s.hidden=j!==cur});
    var s=slides[cur];
    document.getElementById('cap-uc').textContent=s.dataset.uc;
    document.getElementById('cap-title').textContent=s.dataset.title;
    document.getElementById('cap-desc').textContent=s.dataset.desc;
    notes(s.dataset.id);
    document.getElementById('count').textContent=(cur+1)+' / '+slides.length;
    thumbs.forEach(function(t,j){t.setAttribute('aria-current',j===cur?'true':'false')});
    var th=thumbs[cur]; if(th&&th.scrollIntoView){th.scrollIntoView({block:'nearest',inline:'nearest'})}
    if(!noHash){try{history.replaceState(null,'','#'+s.dataset.id)}catch(e){}}
    fit();
  }
  document.addEventListener('click',function(e){
    var a=e.target.closest('[data-go]'); if(!a)return;
    var j=ids.indexOf(a.dataset.go); if(j<0)return;
    e.preventDefault(); show(j);
  });
  document.getElementById('prev').onclick=function(){show(cur-1)};
  document.getElementById('next').onclick=function(){show(cur+1)};
  document.addEventListener('keydown',function(e){
    if(e.target.closest&&e.target.closest('input,textarea'))return;
    if(e.key==='ArrowRight'){show(cur+1)} else if(e.key==='ArrowLeft'){show(cur-1)}
  });
  var hot=document.getElementById('t-hot'), tags=document.getElementById('t-tags'), tn=document.getElementById('t-notes'), tq=document.getElementById('t-q');
  function flags(){document.body.classList.toggle('hot',hot.checked);document.body.classList.toggle('hidetags',!tags.checked);document.body.classList.toggle('nonotes',!tn.checked);document.body.classList.toggle('noq',!tq.checked);fit()}
  hot.onchange=flags; tags.onchange=flags; tn.onchange=flags; tq.onchange=flags;
  window.addEventListener('resize',fit);
  if(document.fonts&&document.fonts.ready){document.fonts.ready.then(fit)}
  var h=(location.hash||'').slice(1), start=Math.max(0,ids.indexOf(h));
  flags(); show(start,true);
})();
</script>

<!-- Comment layer: comment on a field, a table row or a presenter note. Needs capabilities {"comments":{"composer_only":true,"customAnchors":true}} on publish; without it the button stays hidden. -->
<style>
#cm-btn{position:fixed;right:18px;bottom:18px;z-index:50;display:none;align-items:center;gap:8px;padding:10px 16px;border-radius:22px;border:0;background:#5B2BD6;color:#fff;font:600 14px Montserrat,Roboto,Arial,sans-serif;box-shadow:0 6px 18px rgba(91,43,214,.35);cursor:pointer}
#cm-btn.on{background:#1F2937}
#cm-tip{position:fixed;left:50%;transform:translateX(-50%);bottom:22px;z-index:50;display:none;padding:8px 14px;border-radius:8px;background:#1F2937;color:#fff;font:500 13px Montserrat,Roboto,Arial,sans-serif}
body.cm-pick #cm-tip{display:block}
body.cm-pick #stage *,body.cm-pick #n-click li,body.cm-pick #n-say-text,body.cm-pick #n-q li{cursor:crosshair!important}
.cm-hover{outline:2px solid #7B4DFF!important;outline-offset:1px;background-color:rgba(123,77,255,.06)}
</style>
<button type="button" id="cm-btn" aria-pressed="false">💬 Comment</button>
<div id="cm-tip">Click a field, row or note to comment on it · Esc to stop</div>
<script>
(function(){
  var btn=document.getElementById('cm-btn'), on=false, shellMode=false, ctl=null, threads=[], hoverEl=null, known={};
  function slideOf(el){var s=el.closest&&el.closest('section.slide');return s||null}
  function curSlide(){return document.querySelector('section.slide:not([hidden])')}
  function curId(){var s=curSlide();return s?s.dataset.id:''}
  function txt(el){return (el.textContent||'').replace(/\s+/g,' ').trim()}
  // Pick the meaningful element under the click: a table cell, a field, a card, a chip, a note line.
  function pick(t){
    if(!t||!t.closest)return null;
    var note=t.closest('#n-click li,#n-say-text,#n-q li');
    if(note)return note;
    if(!t.closest('#stage'))return null;
    return t.closest('td,th,.fv,.fl,.kpi,.st,.chip,.aic,.btn,.bot,.you,.ask,.tile,.it,.f,.li,.hb,h1,h3,.ct,li,a,.card')||t;
  }
  function describe(el){
    var sid=curId(), note=el.closest('#n-click li,#n-say-text,#n-q li');
    if(note){var kind=el.closest('#n-q')?'Question':el.closest('#n-click')?'Click step':'Say';return {target:document.querySelector('.thumb[data-go="'+sid+'"]')||el,label:sid+' · '+kind+': '+txt(el).slice(0,90),detail:kind+' on screen '+sid+': '+txt(el)}}
    var row=el.closest('tr'), card=el.closest('.card,.kpi,.tile');
    var head=card&&card.querySelector('.ct,h3,.l');
    var label=sid+' · '+txt(el).slice(0,80);
    var detail='Screen '+sid+(head?' · block "'+txt(head).slice(0,80)+'"':'')+(row&&row!==el?' · row "'+txt(row).slice(0,160)+'"':'')+' · element "'+txt(el).slice(0,200)+'"';
    return {target:el,label:label,detail:detail};
  }
  function setPick(v){on=v;document.body.classList.toggle('cm-pick',v);btn.classList.toggle('on',v);btn.setAttribute('aria-pressed',v?'true':'false');btn.textContent=v?'✕ Stop commenting':'💬 Comment';if(!v&&hoverEl){hoverEl.classList.remove('cm-hover');hoverEl=null}}
  function active(){return on||shellMode}
  function point(el){
    if(!el||!el.isConnected)return null;
    var s=slideOf(el); if(s&&s.hidden)return null;
    var r=el.getBoundingClientRect(); if(!r.width&&!r.height)return null;
    return {x:r.left+Math.min(r.width-4,Math.max(8,r.width*0.9))+scrollX,y:r.top+Math.min(14,r.height/2)+scrollY};
  }
  function find(anchor){
    if(known[anchor]&&known[anchor].isConnected)return known[anchor];
    try{return document.querySelector(anchor)}catch(e){return null}
  }
  function report(){
    if(!ctl)return; var map={};
    threads.forEach(function(t){map[t.id]=point(find(t.anchor))});
    try{ctl.placed(map)}catch(e){}
  }
  var raf=0; function soon(){if(raf)return;raf=requestAnimationFrame(function(){raf=0;report()})}
  document.addEventListener('mouseover',function(e){if(!active())return;var el=pick(e.target);if(el===hoverEl)return;if(hoverEl)hoverEl.classList.remove('cm-hover');hoverEl=el;if(el)el.classList.add('cm-hover')},true);
  document.addEventListener('click',function(e){
    if(!active()||!ctl)return;
    if(e.target.closest('#cm-btn,.top,.thumb,label,input'))return;
    var el=pick(e.target); if(!el)return;
    e.preventDefault(); e.stopPropagation();
    var d=describe(el), pair;
    try{pair=ctl.domAnchor(d.target,e)}catch(err){return}
    known[pair[0]]=d.target;
    ctl.compose(pair[0],pair[1],{label:d.label,detail:d.detail}).catch(function(){});
  },true);
  document.addEventListener('keydown',function(e){if(e.key==='Escape'&&on){setPick(false);if(ctl)ctl.exitMode()}});
  btn.onclick=function(){setPick(!on);if(!on&&ctl)ctl.exitMode()};
  new MutationObserver(soon).observe(document.getElementById('stage')||document.body,{subtree:true,attributes:true,attributeFilter:['hidden','style']});
  window.addEventListener('resize',soon);
  if(!window.claude||!claude.use)return;
  claude.use('comments').then(function(c){
    if(!c||!c.customAnchors)return;
    return c.customAnchors({
      mode:function(v){shellMode=v;if(!v)setPick(false);else document.body.classList.add('cm-pick')},
      threads:function(list){threads=list||[];report()},
      reveal:function(id){
        var t=threads.filter(function(x){return x.id===id})[0]; if(!t)return;
        var el=find(t.anchor); if(!el)return;
        var s=slideOf(el);
        if(s&&s.hidden){var th=document.querySelector('.thumb[data-go="'+s.dataset.id+'"]');if(th)th.click()}
        setTimeout(function(){el.scrollIntoView({block:'center',behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth'});soon()},60);
      },
      composing:function(){}
    }).then(function(x){ctl=x;btn.style.display='inline-flex';report()});
  }).catch(function(){});
})();
</script>

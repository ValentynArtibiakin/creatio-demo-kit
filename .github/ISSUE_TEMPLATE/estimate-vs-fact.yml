name: Estimate vs fact
description: A delivered demo - what the estimator said and what it really took (feeds the shared calibration)
title: "<industry, kind of demo>: estimate vs fact"
labels: ["estimate", "calibration"]
body:
  - type: input
    id: demo
    attributes:
      label: Kind of demo
      description: Industry and kind of demo, e.g. "insurance, claims, AI Studio agent". PUBLIC REPO - no customer names, people, case numbers, stand URLs or credentials.
    validations:
      required: true
  - type: textarea
    id: estimate
    attributes:
      label: Estimate given
      description: Row from estimates.csv - era, P50/P80 hours and days.
    validations:
      required: true
  - type: textarea
    id: fact
    attributes:
      label: Fact
      description: Start and handover dates, build hours (or days × hours per day), reviewer / co-builders, stand type (fresh, cloned, shared), what was cut from the script.
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope summary
      description: Use cases, new objects, pages, mobile pages, processes, AI skills / Studio agents, custom components, integrations, languages (the scope file is fine).
  - type: textarea
    id: miss
    attributes:
      label: Biggest miss and proposed change
      description: Which cost line or risk was most wrong, and what price you would set.
